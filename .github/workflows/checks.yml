name: CPU correctness and integration
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,data,modal]'
      - name: Test (no network calls or GPU jobs)
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Real 44M forward/backward step on CPU, synthetic IDs
        run: python scripts/model_check.py --real-step
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-test-results
          path: test-results.xml
